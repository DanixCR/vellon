name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Vellon.slnx

      - name: Build
        run: dotnet build backend/Vellon.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Vellon.slnx --no-build --configuration Release

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/vellon-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend/vellon-web

      - name: Lint
        run: npm run lint --prefix frontend/vellon-web

      - name: Build
        run: npm run build --prefix frontend/vellon-web

  security-review:
    name: Security Review (Claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-security-review@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
